<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>All Feedback</title>

    <style>
        nav {
    text-align: center;
    margin-bottom: 20px;
}

nav a {
    display: inline-block;
    padding: 10px 20px;
    margin: 5px;
    background-color: #333;
    color: white;
    text-decoration: none;
    border-radius: 5px;
}

nav a:hover {
    background-color: #555;
}

        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 1100px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 10px #ccc;
        }

        h1 {
            text-align: center;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 25px;
        }

        th,
        td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: left;
        }

        th {
            background-color: #333;
            color: white;
        }

        tr:nth-child(even) {
            background-color: #f5f5f5;
        }

        .rating {
            font-weight: bold;
        }

        .message {
            text-align: center;
            margin-top: 20px;
            font-weight: bold;
        }

        .back-button {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 15px;
            background-color: #333;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }

        #editForm {
            display: none;
            margin-top: 20px;
            padding: 20px;
            background-color: #f5f5f5;
            border-radius: 8px;
        }

        #editForm input,
        #editForm select,
        #editForm textarea {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            box-sizing: border-box;
        }

        #editForm textarea {
            height: 80px;
        }

        button {
            padding: 8px 12px;
            margin: 3px;
            cursor: pointer;
        }
        .filters {
    display: flex;
    gap: 10px;
    margin-top: 20px;
}

.filters input,
.filters select {
    padding: 10px;
    border: 1px solid #ccc;
    border-radius: 5px;
    flex: 1;
}

@media (max-width: 700px) {
    .filters {
        flex-direction: column;
    }
}

    </style>

</head>

<body>
    <nav>
    
    <a href="/">Submit Feedback</a>
    <a href="/feedback.html">View All Feedback</a>
    <a href="/dashboard.html">Dashboard</a>
</nav>

<div class="container">

    <h1>College Feedback</h1>
    <div class="filters">

    <input
        type="text"
        id="searchInput"
        placeholder="Search by student name..."
        onkeyup="filterFeedback()"
    >

    <select id="departmentFilter" onchange="filterFeedback()">
        <option value="">All Departments</option>
        <option value="CSE">CSE</option>
        <option value="IT">IT</option>
        <option value="ECE">ECE</option>
    </select>

    <select id="ratingFilter" onchange="filterFeedback()">
        <option value="">All Ratings</option>
        <option value="5">5 Stars</option>
        <option value="4">4 Stars</option>
        <option value="3">3 Stars</option>
        <option value="2">2 Stars</option>
        <option value="1">1 Star</option>
        <button onclick="clearFilters()">Clear Filters</button>
    </select>
    <button type = "button"
    onclick="clearFilters()">ClearFilters</button>

</div>


    <!-- EDIT FORM -->

    <div id="editForm">

        <h2>Edit Feedback</h2>

        <input type="hidden" id="edit_id">

        <label>Student Name</label>
        <input type="text" id="edit_student_name">

        <br><br>

        <label>Department</label>
        <input type="text" id="edit_department">

        <br><br>

        <label>Year</label>
        <input type="text" id="edit_year">

        <br><br>

        <label>Faculty Name</label>
        <input type="text" id="edit_faculty_name">

        <br><br>

        <label>Rating</label>

        <select id="edit_rating">
            <option value="5">5 - Excellent</option>
            <option value="4">4 - Very Good</option>
            <option value="3">3 - Good</option>
            <option value="2">2 - Average</option>
            <option value="1">1 - Poor</option>
        </select>

        <br><br>

        <label>Comments</label>

        <textarea id="edit_comments"></textarea>

        <br><br>

        <button onclick="updateFeedback()">
            Save Changes
        </button>

        <button onclick="cancelEdit()">
            Cancel
        </button>

    </div>


    <!-- FEEDBACK TABLE -->

    <table>

        <thead>

            <tr>

                <th>Student Name</th>

                <th>Department</th>

                <th>Year</th>

                <th>Faculty</th>

                <th>Rating</th>

                <th>Comments</th>

                <th>Actions</th>

            </tr>

        </thead>


        <tbody id="feedbackTable">

        </tbody>

    </table>


    <div class="message" id="message"></div>


    <a href="/" class="back-button">
        Back to Feedback Form
    </a>

</div>


<script>


// LOAD ALL FEEDBACK
// FILTER FEEDBACK
function filterFeedback() {


    const search =
        document.getElementById("searchInput").value.toLowerCase();

    const department =
        document.getElementById("departmentFilter").value;

    const rating =
        document.getElementById("ratingFilter").value;

    const rows =
        document.querySelectorAll("#feedbackTable tr");

    rows.forEach(row => {

        const studentName =
            row.cells[0].innerText.toLowerCase();

        const studentDepartment =
            row.cells[1].innerText;

        const studentRating =
            row.cells[4].innerText.replace("/5", "");

        const matchesSearch =
            studentName.includes(search);

        const matchesDepartment =
            department === "" ||
            studentDepartment === department;

        const matchesRating =
            rating === "" ||
            studentRating === rating;

        if (
            matchesSearch &&
            matchesDepartment &&
            matchesRating
        ) {
            row.style.display = "";
        } else {
            row.style.display = "none";
        }

    });
}
function clearFilters() {

    document.getElementById("searchInput").value = "";

    document.getElementById("departmentFilter").value = "";

    document.getElementById("ratingFilter").value = "";

    filterFeedback();
}

async function loadFeedback() {

    try {

        const response = await fetch("/feedback");

        const result = await response.json();

        if (!response.ok) {

            throw new Error(
                result.error || "Failed to load feedback"
            );

        }

        const table =
            document.getElementById("feedbackTable");

        table.innerHTML = "";


        result.data.forEach(feedback => {

            const row = document.createElement("tr");


            row.innerHTML = `

                <td>${feedback.student_name}</td>

                <td>${feedback.department}</td>

                <td>${feedback.year}</td>

                <td>${feedback.faculty_name}</td>

                <td class="rating">
                    ${feedback.rating}/5
                </td>

                <td>${feedback.comments}</td>

                <td>

                    <button onclick="editFeedback(${feedback.id})">
                        Edit
                    </button>

                    <button onclick="deleteFeedback(${feedback.id})">
                        Delete
                    </button>

                </td>

            `;


            table.appendChild(row);

        });


        if (result.data.length === 0) {

            document.getElementById("message").innerText =
                "No feedback available.";

        }

    }

    catch (error) {

        console.error(error);

        document.getElementById("message").innerText =
            "Failed to load feedback.";

    }

}



// EDIT FEEDBACK

async function editFeedback(id) {

    try {

        const response =
            await fetch(`/feedback/${id}`);

        const result =
            await response.json();


        if (!response.ok) {

            throw new Error(
                result.error || "Failed to get feedback"
            );

        }


        const feedback = result.data;


        document.getElementById("edit_id").value =
            feedback.id;

        document.getElementById("edit_student_name").value =
            feedback.student_name;

        document.getElementById("edit_department").value =
            feedback.department;

        document.getElementById("edit_year").value =
            feedback.year;

        document.getElementById("edit_faculty_name").value =
            feedback.faculty_name;

        document.getElementById("edit_rating").value =
            feedback.rating;

        document.getElementById("edit_comments").value =
            feedback.comments;


        document.getElementById("editForm").style.display =
            "block";


        window.scrollTo(0, 0);

    }

    catch (error) {

        console.error(error);

        alert("Failed to load feedback.");

    }

}



// UPDATE FEEDBACK

async function updateFeedback() {

    const id =
        document.getElementById("edit_id").value;


    const feedback = {

        student_name:
            document.getElementById("edit_student_name").value,

        department:
            document.getElementById("edit_department").value,

        year:
            document.getElementById("edit_year").value,

        faculty_name:
            document.getElementById("edit_faculty_name").value,

        rating:
            Number(
                document.getElementById("edit_rating").value
            ),

        comments:
            document.getElementById("edit_comments").value

    };


    try {

        const response =
            await fetch(`/feedback/${id}`, {

                method: "PUT",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify(feedback)

            });


        const result =
            await response.json();


        if (!response.ok) {

            throw new Error(
                result.error || "Failed to update feedback"
            );

        }


        alert("Feedback updated successfully!");


        document.getElementById("editForm").style.display =
            "none";


        loadFeedback();

    }

    catch (error) {

        console.error(error);

        alert("Failed to update feedback.");

    }

}



// DELETE FEEDBACK

async function deleteFeedback(id) {

    const confirmDelete =
        confirm(
            "Are you sure you want to delete this feedback?"
        );


    if (!confirmDelete) {

        return;

    }


    try {

        const response =
            await fetch(`/feedback/${id}`, {

                method: "DELETE"

            });


        const result =
            await response.json();


        if (!response.ok) {

            throw new Error(
                result.error || "Failed to delete feedback"
            );

        }


        alert("Feedback deleted successfully!");


        loadFeedback();

    }

    catch (error) {

        console.error(error);

        alert("Failed to delete feedback.");

    }

}



// CANCEL EDIT

function cancelEdit() {

    document.getElementById("editForm").style.display =
        "none";

}



// LOAD DATA WHEN PAGE OPENS

loadFeedback();


</script>

</body>

</html>
